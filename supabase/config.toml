# Edge function registrations.
#
# Most functions are auto-detected on push, but some Lovable/Supabase
# deploy pipelines need brand-new function directories to be listed
# explicitly here before they'll pick them up. Functions added to
# `supabase/functions/` after May 27, 2026 are registered here so
# the next deploy includes them in the bundle.

[functions.authorize-booking-balance]
verify_jwt = false

[functions.retry-balance-authorizations]
verify_jwt = false

[functions.capture-booking-balance]
verify_jwt = false

[functions.cancel-booking-for-auth-failure]
verify_jwt = false

# AI SMS conversion agent. GHL fires inbound-message webhooks without a
# Supabase JWT, so this must accept unauthenticated POSTs.
[functions.ghl-sms-ai-agent]
verify_jwt = false

# Cold-lead re-engagement sweep. Invoked by pg_cron with the anon JWT.
[functions.reengage-cold-leads]
verify_jwt = false

# Idempotent customer confirmation email + SMS fan-out. Invoked
# internally (service-role JWT) by save-booking-details and
# stripe-webhook, so JWT verification stays on.
[functions.booking-confirm-comms]
verify_jwt = true

# Housecall Pro webhook receiver. HCP posts events without a Supabase
# JWT — authenticity is enforced via HCP_WEBHOOK_SECRET HMAC instead.
[functions.receive-hcp-webhook]
verify_jwt = false

# OpenPhone inbound-message webhook (STOP/START opt-outs, reply logging).
# OpenPhone posts without a Supabase JWT — authenticity is enforced via
# OPENPHONE_WEBHOOK_SECRET HMAC instead.
[functions.openphone-webhook]
verify_jwt = false

# Lifecycle engine sweep (cadence + offers + campaigns). Invoked by
# pg_cron with the anon JWT, same pattern as reengage-cold-leads.
[functions.lifecycle-engine]
verify_jwt = false

# One-click email unsubscribe target — opened from email clients, so it
# must accept unauthenticated GETs.
[functions.lifecycle-unsubscribe]
verify_jwt = false

# HCP retry/backfill sweeps — invoked by pg_cron with the anon JWT.
[functions.retry-failed-hcp-syncs]
verify_jwt = false

[functions.ensure-recent-bookings-hcp-synced]
verify_jwt = false
